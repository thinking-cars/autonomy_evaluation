name: docker-ros

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-ros:
    runs-on: ubuntu-latest
    steps:
      - uses: ika-rwth-aachen/docker-ros@main
        id: docker-ros
        with:
          platform: amd64
          target: dev,run
          base-image: rwthika/ros2:jazzy
          rmw-implementation: rmw_zenoh_cpp
          command: ros2 launch autonomy_evaluation autonomy_evaluation.launch.py
          enable-slim: false
          # import only the repositories of .repos: the .repos files of autonomy_datasets and planning_interfaces
          # name rviz_2d_overlay_plugins from different repositories, which a recursive import cannot clone both
          enable-recursive-vcs-import: false
        env:
          TARGET_CMAKE_ARGS: -DCMAKE_EXPORT_COMPILE_COMMANDS=1
      - name: Run tests
        run: |
          docker run --rm -u root:root \
            "${{ steps.docker-ros.outputs.dev-image }}" \
            bash -ic '
              PACKAGES=$(colcon list --base-paths /docker-ros/ws/src/target --names-only) &&
              colcon build --symlink-install --packages-up-to $PACKAGES &&
              colcon test --packages-select $PACKAGES
              colcon test-result --verbose
            '
